[package]
name = "cargo-min-publish-age"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cargo-min-publish-age"
path = "src/main.rs"

[dependencies]
tiny_http = { version = "0.12.0", default-features = false }
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
serde_json = { version = "1.0.149", default-features = false, features = [
  "std",
] }
time = { version = "0.3.47", default-features = false, features = [
  "std",
  "parsing",
] }
toml_edit = "0.25.11"
